# tmux settings for the sessions bin/clone opens over SSH. They run on their own tmux
# server (tmux -L clone), so this file does not touch any other tmux you use.
set -g default-terminal "tmux-256color"
set -g history-limit 100000
# Scroll back through the agent's output with the trackpad or wheel. Hold Option (iTerm2)
# or Fn (Terminal) while dragging to select text the usual way.
set -g mouse on
set -g escape-time 10
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[bold]#S#[nobold]  "
set -g status-left-length 40
set -g status-right "Ctrl-b d detaches, the agent keeps running"
set -g status-right-length 60
